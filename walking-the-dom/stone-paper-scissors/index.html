<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rps</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="heading">
      <h1>Stone Paper Scissors</h1>
    </div>
    <div class="box">
      <div class="option" id="rock">
        <img src="imgs/rock.png" alt="" />
      </div>
      <div class="option" id="paper">
        <img src="imgs/paper.png" alt="" />
      </div>
      <div class="option" id="scissors">
        <img src="imgs/scissors.png" alt="" />
      </div>
    </div>
    <div class="score">
      <div id="you">
        <p>0</p>
        <p>You</p>
      </div>
      <div id="comp">
        <p>0</p>
        <p>Computer</p>
      </div>
    </div>
    <div id="msg">
      <p id="msg-sc">Chose your option to play!</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
